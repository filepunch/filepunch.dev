<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filepunch home screen icon</title>
<!--
  Source of site/apple-touch-icon.png, the 180 x 180 icon that phones show
  when someone adds the site to their home screen. It is site/favicon.svg on
  the dark background of the site. render.sh turns it into the PNG.
-->
<style>
  html, body { margin: 0; }
  body { width: 180px; height: 180px; overflow: hidden; background: #0a0e17; display: grid; place-items: center; }
  img { width: 136px; height: 136px; display: block; }
</style>
</head>
<body><img src="../site/favicon.svg" alt=""></body>
</html>
