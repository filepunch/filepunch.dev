# Publishes the site/ directory to GitHub Pages on every push to main.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # Only site/ is published, so README.md and images/ stay out.
          path: site
          # Also publish files and folders whose names start with a dot,
          # such as .well-known/security.txt. Without this line the
          # upload leaves them out.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
